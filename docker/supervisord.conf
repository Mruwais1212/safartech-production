[supervisord]
nodaemon=true
user=root
logfile=/var/www/html/storage/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=1
stderr_logfile=/var/www/html/storage/logs/php-fpm.err.log
stdout_logfile=/var/www/html/storage/logs/php-fpm.out.log

; Laravel scheduler - runs every 60 seconds and dispatches due commands.
; The scheduler in bootstrap/app.php fires queue:work --stop-when-empty
; every minute, so no separate long-running queue worker is needed here.
[program:scheduler]
command=bash -c "while true; do php /var/www/html/artisan schedule:run --no-interaction 2>&1; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
priority=5
stderr_logfile=/var/www/html/storage/logs/scheduler.err.log
stdout_logfile=/var/www/html/storage/logs/scheduler.out.log
